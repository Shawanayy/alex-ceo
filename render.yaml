# Render deployment blueprint for Alex's remote MCP server (src/remoteMcpServer.js).
# This is what makes Alex reachable from Cowork (Cowork requires a public HTTPS MCP endpoint,
# not a local stdio process). Deploy via Render's "New +" -> "Blueprint" and point it at this repo,
# or create the service manually in the dashboard using these same settings.
#
# All secrets below are marked `sync: false`, meaning Render will NOT read them from this file —
# you paste the real values into the Render dashboard yourself after the service is created.
# Nothing secret ever gets committed to git.

services:
  - type: web
    name: alex-ceo-mcp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/remoteMcpServer.js
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALEX_MODEL
        value: claude-sonnet-5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: CANVAS_ICS_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ALEX_REMOTE_MCP_TOKEN
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false

  # Render deployment for the actual Telegram bot (src/index.js), so Alex stays reachable on
  # Telegram 24/7 with no laptop involved. Runs in webhook mode (USE_WEBHOOK=true) rather than
  # long polling — free-tier Render sleeps the service after inactivity, and webhook mode tolerates
  # that fine (Telegram just retries delivery until the service wakes back up), whereas long polling
  # would need to hold an open connection the whole time.
  #
  # After this service is live, register the webhook so Telegram knows to push updates here instead
  # of waiting for polling:
  #   curl "https://api.telegram.org/bot<TELEGRAM_BOT_TOKEN>/setWebhook?url=https://<this-service>.onrender.com/telegram/<TELEGRAM_BOT_TOKEN>"
  - type: web
    name: alex-ceo-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: USE_WEBHOOK
        value: 'true'
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_USER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALEX_MODEL
        value: claude-sonnet-5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: CANVAS_ICS_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false

  # Twice-a-day (not hourly) read-only price alert monitor (src/priceAlertMonitor.js).
  # Notify-only — no trading, no cost basis, no Robinhood/Plaid access. Runs as two Cron Jobs
  # rather than a long-lived web service since each just needs to wake up, check prices, maybe
  # send a Telegram message, and exit. State (high-water marks, anti-spam crossing flags) is NOT
  # kept on local disk — Cron Jobs get a fresh ephemeral container every run — it's persisted in
  # Supabase's `price_alert_state` table instead, so it survives across runs.
  #
  # Two services, not one, because Render Cron schedules are UTC-only with no timezone option,
  # and the two target ET times (~10:00am, ~3:30pm) convert to UTC minutes that differ (:00 vs
  # :30) between EST and EDT — a single cron string can't express "10:00am ET" and "3:30pm ET"
  # without either a manual edit every DST changeover or an 8-way cross-product of firings. Each
  # service instead lists BOTH possible UTC hours for its one target time (one per DST regime);
  # whichever fires at the "wrong" offset for the current season lands ~60 minutes from its ET
  # target and the script's own isNearScheduledCheckTimeET() check skips it cleanly — so this
  # self-adjusts across DST with no manual cron updates needed.
  - type: cron
    name: alex-ceo-price-alert-monitor-open
    env: node
    plan: starter
    # 14:00 UTC = 10:00am EDT (summer); 15:00 UTC = 10:00am EST (winter).
    schedule: "0 14,15 * * 1-5"
    buildCommand: npm install
    startCommand: node src/priceAlertMonitor.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_USER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false

  - type: cron
    name: alex-ceo-price-alert-monitor-close
    env: node
    plan: starter
    # 19:30 UTC = 3:30pm EDT (summer); 20:30 UTC = 3:30pm EST (winter).
    schedule: "30 19,20 * * 1-5"
    buildCommand: npm install
    startCommand: node src/priceAlertMonitor.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_USER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
